<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#1a1a1a"/>
  
  <!-- Diagonal stripes pattern -->
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#242424"/>
      <rect x="20" width="20" height="40" fill="#1a1a1a"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#stripes)" opacity="0.3"/>
  
  <!-- Main icon - gear/cog -->
  <g transform="translate(400, 280)">
    <path d="M 0,-80 L 15,-70 L 15,-50 L 30,-40 L 45,-50 L 60,-40 L 60,-15 L 70,-15 L 80,0 L 70,15 L 60,15 L 60,40 L 45,50 L 30,40 L 15,50 L 15,70 L 0,80 L -15,70 L -15,50 L -30,40 L -45,50 L -60,40 L -60,15 L -70,15 L -80,0 L -70,-15 L -60,-15 L -60,-40 L -45,-50 L -30,-40 L -15,-50 L -15,-70 Z" 
          fill="none" stroke="#dc2626" stroke-width="8"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#dc2626" stroke-width="8"/>
    <circle cx="0" cy="0" r="15" fill="#dc2626"/>
  </g>
  
  <!-- "COMING SOON" text -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">
    COMING SOON
  </text>
  
  <!-- "NerdbillyFab" text -->
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#9ca3af" text-anchor="middle">
    NerdbillyFab
  </text>
  
  <!-- Accent line -->
  <line x1="300" y1="560" x2="500" y2="560" stroke="#dc2626" stroke-width="2"/>
</svg>
